name: Update GoatCounter stats

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch GoatCounter stats
        env:
          GOATCOUNTER_API_KEY: ${{ secrets.GOATCOUNTER_API_KEY }}
        run: python fetch_stats.py

      - name: Commit and push stats.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json

          if git diff --staged --quiet; then
            echo "stats.json sem mudanças, nada a commitar."
            exit 0
          fi

          if [ "$(git log -1 --pretty=%an)" = "github-actions[bot]" ]; then
            git commit --amend --no-edit
            git push --force-with-lease
          else
            git commit -m "Atualiza stats.json [skip ci]"
            git push
          fi
