<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Casa do Camarão</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/images/links/favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(circle at 50% 35%, #3d0a12 0%, #1c1c1c 65%);
    font-family: 'Space Grotesk', sans-serif;
    color: #f2f2f0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .box {
    max-width: 460px;
    width: 100%;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }
  .logo { width: 64px; height: 64px; object-fit: cover; border-radius: 50%; margin-bottom: 16px; }
  .code {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(64px, 16vw, 96px);
    line-height: 1;
    color: #C7092B;
    margin: 0;
  }
  h1 {
    width: 100%;
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(20px, 5vw, 26px);
    text-transform: uppercase;
    letter-spacing: -0.3px;
    margin: 8px 0 0;
    color: #f2f2f0;
  }
  p {
    width: 100%;
    margin: 4px 0 0;
    font-size: 15px;
    line-height: 1.6;
    color: #a3a3a3;
    max-width: 360px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 28px;
    background: #C7092B;
    color: #ffffff;
    padding: 15px 28px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    text-decoration: none;
    border-radius: 999px;
    transition: background 0.2s;
  }
  .btn:hover { background: #a30722; }

  @media (max-width: 420px) {
    .logo { width: 52px; height: 52px; }
    .btn { width: 100%; justify-content: center; padding: 14px 24px; }
  }
</style>
</head>
<body>

  <div class="box">
    <img class="logo" src="/images/links/logo.png" alt="Casa do Camarão">
    <p class="code">404</p>
    <h1>Página não encontrada</h1>
    <p>O endereço que você tentou acessar não existe ou foi movido.</p>
    <a class="btn" href="/">Ir para Home</a>
  </div>

</body>
</html>
